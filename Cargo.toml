[package]
name = "tame-index"
version = "0.26.3"
edition = "2024"
rust-version = "1.85.0"
description = "Provides access to local and remote cargo registry indices"
license = "Apache-2.0 OR MIT"
documentation = "https://docs.rs/tame-index"
homepage = "https://github.com/EmbarkStudios/tame-index"
repository = "https://github.com/EmbarkStudios/tame-index"

[features]
default = []
# Enables building of local registries
local-builder = ["dep:sha2", "dep:bytes"]

[dependencies]
bytes = { version = "1.11", optional = true }
# All paths are assumed to be utf-8 for ease of use and implementation
camino = "1.1"
# Allows calling crates to provide their own HTTP implementation, try to keep aligned with reqwest/hyper/ureq etc
http = "1.3"
# Nicer scanning through bytes
memchr = "2.5"
# Nicer loading of files from disk
memmap2 = "0.9"
# Contains hasher used by cargo 1.85.0+
rustc-stable-hash = "0.1"
# Nicer versions for users
semver = { version = "1.0", features = ["serde"] }
# De/serialization
serde = { version = "1.0", default-features = false }
# Index information is serialized as JSON in both the lines and cache format
serde_json = "1.0"
sha2 = { version = "0.11", optional = true, default-features = false }
# Smaller fixed size strings with heap fallback
smol_str = { version = "0.3", features = ["serde"] }
# cargo config parsing
toml-span = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.dev.package.sha2]
opt-level = 3
